<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="אפליקציית הימורי כדורגל - השתתף בתחרות עם החברים"
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="הימורי כדורגל" />
    
    <title>🏆 אפליקציית הימורי כדורגל</title>
    <style>
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #000; }
      .boot img { width: 148px; height: 148px; }
      .boot__dots { display: flex; gap: 8px; }
      .boot__dots i { width: 8px; height: 8px; border-radius: 50%; background: #fff; opacity: .25; animation: boot-dot 1s ease-in-out infinite; }
      .boot__dots i:nth-child(2) { animation-delay: .15s; }
      .boot__dots i:nth-child(3) { animation-delay: .3s; }
      @keyframes boot-dot { 0%, 100% { opacity: .25; transform: translateY(0) } 50% { opacity: 1; transform: translateY(-4px) } }
      @media (prefers-reduced-motion: reduce) { .boot__dots i { animation: none; opacity: .6 } }
    </style>
  </head>
  <body>
    <noscript>אתה צריך להפעיל JavaScript כדי להשתמש באפליקציה.</noscript>
    <!-- מסך פתיחה: ממשיך בדיוק את מסך הפתיחה של הטלפון (רקע שחור והלוגו,
         מה-manifest) עד שהאפליקציה מוכנה - ואז React מחליף אותו. בלי זה
         היה מבזק של דף לבן ריק בין מסך הפתיחה לאפליקציה -->
    <div id="root"><div class="boot"><img src="/logo512.png" alt="Gamball" width="148" height="148" /><span class="boot__dots"><i></i><i></i><i></i></span></div></div>
    <script type="module" src="/src/index.js"></script>
    
    <!-- Service Worker Registration (גיבוי) -->
    <script>
      // רישום Service Worker כגיבוי אם לא נרשם ב-index.js
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.getRegistration().then(function(registration) {
            if (!registration) {
              // אם אין רישום קיים, רשום עכשיו
              navigator.serviceWorker.register('/service-worker.js')
                .then(function(reg) {
                  console.log('✅ Service Worker registered (from HTML):', reg.scope);
                })
                .catch(function(error) {
                  console.error('❌ Service Worker registration failed (from HTML):', error);
                });
            } else {
              console.log('✅ Service Worker already registered:', registration.scope);
            }
          });
        });
      }
    </script>
  </body>
</html>
